appId: com.freellm.console
productName: FreeLLM Console
copyright: Copyright © 2026 Enming Xiong
directories:
  output: dist
  buildResources: assets
files:
  - src/**/*
  - renderer/**/*
  - assets/**/*
  - THIRD_PARTY_NOTICES.md
  - package.json
  - "!**/*.map"
asar: true
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: resources/task-router.cjs
    to: task-router.cjs
  - from: resources/ccswitch-db.cjs
    to: ccswitch-db.cjs
  - from: resources/runtime
    to: runtime
    filter:
      - "**/*"
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: build/core
    to: core
    filter:
      - "**/*"
      - "!**/.env"
      - "!**/*.log"
      - "!**/server/data/**"
      - "!**/credentials/**"
      - "!**/UNIFIED_API_KEY.txt"
      - "!**/friend-key.txt"
      - "!**/friend-usage.json"
      - "!**/public-url.txt"
      - "!**/*.db"
      - "!**/.git/**"
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: assets/icon.png
  artifactName: "${productName}-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FreeLLM Console
  deleteAppDataOnUninstall: false
  artifactName: "${productName}-Setup-${version}.${ext}"
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: assets/icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: "${productName}-${version}-${arch}.${ext}"
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: assets/icon.png
  category: Development
  maintainer: Enming Xiong <enmingxiong821@gmail.com>
  artifactName: "${productName}-${version}-${arch}.${ext}"
